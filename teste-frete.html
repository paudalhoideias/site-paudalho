<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teste de frete — Pau D'Alho</title><style>body{font:16px Arial,sans-serif;max-width:600px;margin:50px auto;padding:20px;color:#333}input,button{padding:12px;font:inherit}input{width:180px}button{background:#386b40;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;background:#f3f4f2;padding:16px;border-radius:8px}label{display:block;margin:15px 0 8px}</style></head><body><h1>Teste de frete — Torre 3 em 1</h1><p><strong>Consulta real no Melhor Envio</strong>. Não gera etiquetas, pedidos nem pagamentos.</p><p>Origem: 08790-200 · Embalagem: 65 × 45 × 16 cm · 9 kg · 1 volume.</p><form id="form"><label for="cep">CEP de destino</label><input required id="cep" inputmode="numeric" pattern="[0-9]{5}-?[0-9]{3}" placeholder="00000-000"><button type="submit">Calcular frete</button></form><pre id="resultado">Aguardando CEP.</pre><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('resultado');out.textContent='Consultando Melhor Envio...';try{const r=await fetch('/api/melhor-envio/cotacao',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({destination_cep:document.getElementById('cep').value})});const j=await r.json();out.textContent=JSON.stringify(j,null,2);}catch{out.textContent='Falha de comunicação. Tente novamente.'}});</script></body></html>
